# Development stack (`make dev`). Production configuration is prepared in stage 5.
#
# Networks:
#   edge  - Nginx, frontend, backend. Only Nginx publishes a port.
#   data  - PostgreSQL, Redis. internal: no route to the outside world.
#   judge - Judge0 and its own database. internal: student code never reaches
#           the internet or the application database (spec 14.1).

name: kod-izi

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
  LLM_DAILY_QUOTA: ${LLM_DAILY_QUOTA:-40}
  MATERIAL_DIR: /data/materials
  CLAMAV_HOST: clamav
  JUDGE0_URL: http://judge0-server:2358
  JUDGE0_AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN}
  REPO_ROOT: /repo
  SEED_DIR: /seed

x-judge0: &judge0
  image: judge0/judge0:1.13.1
  privileged: true # required by the isolate sandbox inside the container
  volumes:
    - ./judge0/judge0.conf:/judge0.conf:ro
  env_file: ./judge0/judge0.conf
  environment:
    POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
    AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN}
  networks: [judge]
  depends_on:
    judge0-db:
      condition: service_healthy
    judge0-redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        ipv4_address: 172.28.0.10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ../frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks: [edge]

  backend:
    build: ../backend
    environment: *backend-env
    volumes:
      - ../backend:/app
      - ../.claude:/repo/.claude:ro
      - ../seed:/seed:ro
      - materials:/data/materials
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --proxy-headers --forwarded-allow-ips=172.28.0.10"
    networks: [edge, data, judge, llm]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ../backend
    environment: *backend-env
    volumes:
      - ../backend:/app
      - ../seed:/seed:ro
      - materials:/data/materials:ro
    command: sh -c 'rq worker --url "$$REDIS_URL" default'
    networks: [data, judge, llm] # grading calls Judge0 and the local LLM
    depends_on:
      redis:
        condition: service_healthy

  # Isolated processor for uploaded files (spec 14.1): antivirus, text extraction,
  # embeddings. No internet, no web tier, no Judge0.
  extractor:
    build: ../backend
    environment: *backend-env
    command: sh -c 'rq worker --url "$$REDIS_URL" materials'
    volumes:
      - ../backend:/app
      - materials:/data/materials
    networks: [data, scan, llm]
    depends_on:
      redis:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4
    # `edge` only for signature updates (freshclam); files arrive over `scan`.
    networks: [scan, edge]

  # Local LLM (Q-08, Q-09). Optional: `make llm` starts it and downloads the models.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [llm]
    volumes:
      - ollama:/root/.ollama
    # `edge` only to download models; student data reaches it over `llm`.
    networks: [llm, edge]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-server:
    <<: *judge0

  judge0-workers:
    <<: *judge0
    command: ["./scripts/workers"]

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    volumes:
      - judge0-db:/var/lib/postgresql/data
    networks: [judge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
    networks: [judge]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
    ipam:
      config:
        # Fixed subnet so the backend trusts X-Forwarded-For only from Nginx.
        - subnet: 172.28.0.0/24
  data:
    internal: true
  judge:
    internal: true
  llm:
    internal: true
  scan:
    internal: true

volumes:
  pgdata: {}
  materials: {}
  ollama: {}
  judge0-db: {}
