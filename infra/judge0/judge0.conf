# Judge0 limits (spec 14.1, "Код орындау"). Secrets come from the environment, not this file.
# Every run is without network, as an unprivileged user, with CPU, memory, process and
# file-size limits.

ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=10
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=1048576
# Parallel runs; COUNT × MAX_MEMORY_LIMIT stays under the workers' mem_limit (compose).
COUNT=4
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1
ENABLE_WAIT_RESULT=false
# Needed for -std=c++17 / -std=c++2a. Only the backend talks to Judge0 (internal network,
# token) and it sends a fixed option string, never one taken from the student.
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false

AUTHN_HEADER=X-Auth-Token

REDIS_HOST=judge0-redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
