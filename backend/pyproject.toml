[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kod-izi-backend"
version = "0.1.0"
description = "Kod Izi (CodeTrace AI) backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic[email]==2.14.2",
    "pydantic-settings==2.16.2",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "rq==3.0.0",
    "python-multipart==0.0.32",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "lizard==1.24.3",
    "clang-tidy==23.1.4",
    "pyotp==2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "fakeredis==2.40.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    "locust==2.47.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# Kazakh words in docstrings and comments are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "rq.*", "defusedxml.*", "pgvector.*", "pptx.*", "lizard.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
