# Spec 15.4: tests, linters, dependency audit and secret scan on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kodizi_test
          POSTGRES_USER: kodizi
          POSTGRES_PASSWORD: kodizi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kodizi -d kodizi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kodizi:kodizi@localhost:5432/kodizi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff format --check . && ruff check . && ruff check ../.claude/hooks
      - name: mypy
        run: mypy app tests
      - name: bandit
        run: bandit -q -c pyproject.toml -r app
      - name: pytest
        run: pytest
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker compose file
        run: |
          sh infra/scripts/init-env.sh
          docker compose -f infra/docker-compose.yml --env-file .env config --quiet
      - name: Build application images
        run: docker compose -f infra/docker-compose.yml --env-file .env build backend frontend
